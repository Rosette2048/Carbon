services:
  - type: web
    name: carbon-market-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m py_compile carbon_market_news_server.py carbon_market_news_store.py
    startCommand: python carbon_market_news_server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: HKU_API_BASE_URL
        value: https://api.hku.hk
      - key: HKU_API_DEPLOYMENT_ID
        value: claude-haiku-4.5
      - key: HKU_API_KEY_HEADER
        value: api-key
      - key: HKU_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
